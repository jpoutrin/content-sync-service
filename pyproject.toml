[project]
name = "content-sync-service"
version = "0.1.0"
description = "Django service for synchronizing and analyzing YouTube content using AI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.0",
    "django-environ>=0.11.2",
    "djangorestframework>=3.14.0",
    "django-cors-headers>=4.3.1",
    "django-q2>=1.6.1",
    "psycopg2-binary>=2.9.9",
    "youtube-transcript-api>=0.6.2",
    "google-api-python-client>=2.114.0",
    "litellm>=1.0.0",
    "pydantic>=2.5.0",
    "isodate>=0.6.1",
    "PyJWT>=2.8.0",
    "pgvector>=0.3.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = false
check_untyped_defs = true
plugins = [
    "mypy_django_plugin.main",
    "mypy_drf_plugin.main",
]
exclude = [
    "migrations/",
    ".venv/",
    "venv/",
]

[[tool.mypy.overrides]]
module = "*.migrations.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "django_q.*",
    "litellm.*",
    "youtube_transcript_api.*",
]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = [
    ".venv",
    "venv",
    "migrations",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "DJ",     # flake8-django,
    "RUF022",
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["config", "yt_sync", "rag"]
section-order = ["future", "standard-library", "django", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.isort.sections]
django = ["django", "rest_framework"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.coverage.run]
source = ["yt_sync", "rag"]
branch = true
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[dependency-groups]
dev = [
    "django-stubs>=5.2.8",
    "djangorestframework-stubs>=3.16.6",
    "factory-boy>=3.3.3",
    "mypy>=1.19.0",
    "pytest>=9.0.1",
    "pytest-asyncio>=0.21.0",
    "pytest-django>=4.11.1",
    "ruff>=0.14.8",
]
