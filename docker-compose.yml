version: '3.8'

services:
  # Redis is still needed for Celery
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
  # We removed the 'db' service because we will use Supabase (Local or Cloud)
  # To run Supabase locally: `npx supabase start`
